supply_chain_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: "{{ env_var('ERP_PORT', '5432') | int }}"
      user: "{{ env_var('ERP_USER', 'erp_admin') }}"
      password: "{{ env_var('ERP_PASSWORD', 'erp_admin') }}"
      dbname: erp
      schema: analytics
      threads: 4
