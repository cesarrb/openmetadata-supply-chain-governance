version: 2
data_tests:
  - name: assert_otif_rate_between_0_and_1
    description: >
      Validity check: every monthly OTIF rate in `rpt_otif_monthly` must lie between 0 and 1.
      A rate outside that range means the KPI calculation is broken.

  - name: assert_forecast_accuracy_not_degenerate
    description: >
      Plausibility check: fails if the average forecast accuracy in `fct_plan_vs_actual` is above 95 %.
      Real accuracy at material x plant x month level is far lower; a value that high means the formula
      is broken, not that the forecast is perfect. Added after an integer-division bug pushed accuracy
      to 97 % while every validity test still passed.
